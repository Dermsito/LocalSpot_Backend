<div class="preferencias-container">
  <div class="preferencias-card">
    <h1>¿Qué te interesa encontrar?</h1>
    <p class="subtitulo">Selecciona al menos una categoría para personalizar tus búsquedas</p>

    <div class="grid-categorias">
      <div 
        *ngFor="let cat of categorias" 
        class="categoria-item"
        [class.activa]="cat.seleccionada"
        (click)="toggleCategoria(cat)">
        <span class="icono">{{ cat.icono }}</span>
        <span class="nombre">{{ cat.nombre }}</span>
      </div>
    </div>

    <button class="btn-guardar" (click)="guardarPreferencias()">
      Guardar y Continuar
    </button>
  </div>
</div>
