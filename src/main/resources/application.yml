spring:
  application:
    name: localspot-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/localspot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  sql:
    init:
      mode: never

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    build:
      enabled: true
    env:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION:86400000}

localspot:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  verificacion:
    expiracion-minutos: ${VERIFICACION_EXPIRACION_MINUTOS:1440}
    base-url: ${APP_BASE_URL:http://localhost:3000}
    remitente: ${MAIL_FROM:no-reply@localspot.test}
  integrations:
    ai:
      api-key: ${AI_API_KEY:}
      api-url: ${AI_API_URL:https://generativelanguage.googleapis.com}
      model: ${AI_MODEL:gemini-1.5-flash}
    maps:
      api-key: ${MAPS_API_KEY:}
      api-url: ${MAPS_API_URL:https://maps.googleapis.com/maps/api/geocode/json}
      # Centro por defecto cuando no se puede geocodificar (Fusagasuga, Colombia).
      # Configurable para operar en cualquier ciudad sin recompilar.
      default-lat: ${MAPS_DEFAULT_LAT:4.3372}
      default-lon: ${MAPS_DEFAULT_LON:-74.3640}
      default-radio-km: ${MAPS_DEFAULT_RADIO_KM:5}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      aiService:
        base-config: default
      geoService:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 500ms
    instances:
      aiService:
        base-config: default
      geoService:
        base-config: default

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.web: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-no-cid}] %-5level %logger{36} - %msg%n"
