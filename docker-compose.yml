services:
  postgres:
    image: postgres:16
    container_name: localspot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localspot}
      POSTGRES_USER: ${POSTGRES_USER:-localspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localspot123}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localspot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localspot-net

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: localspot-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localspot.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test']"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-15050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - localspot-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: localspot-backend:1.0.0
    container_name: localspot-backend
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-localspot}
      DB_USER: ${POSTGRES_USER:-localspot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-localspot123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-localspot-super-secret-key-12345678901234567890123456789012}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localspot.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123456}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200}
      # Verificacion de correo via SMTP.
      # Desarrollo: Mailpit (MAIL_HOST=mailpit). Produccion: SMTP real (ej. smtp.gmail.com:587).
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localspot.test}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      VERIFICACION_EXPIRACION_MINUTOS: ${VERIFICACION_EXPIRACION_MINUTOS:-1440}
      # Integraciones externas (vacio = se usan los adaptadores stub)
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://generativelanguage.googleapis.com}
      AI_MODEL: ${AI_MODEL:-gemini-1.5-flash}
      MAPS_API_KEY: ${MAPS_API_KEY:-}
      MAPS_DEFAULT_LAT: ${MAPS_DEFAULT_LAT:-4.3372}
      MAPS_DEFAULT_LON: ${MAPS_DEFAULT_LON:--74.3640}
      MAPS_DEFAULT_RADIO_KM: ${MAPS_DEFAULT_RADIO_KM:-5}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - localspot-net

  frontend:
    build:
      context: ../LocalSpot_Frontend
      dockerfile: Dockerfile
      args:
        # API key de Google Maps JavaScript API usada por el mapa embebido del frontend.
        MAPS_API_KEY: ${FRONTEND_MAPS_API_KEY:-}
    image: localspot-frontend:1.0.0
    container_name: localspot-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - localspot-net

  sonarqube:
    image: sonarqube:community
    container_name: localspot-sonarqube
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - localspot-net

networks:
  localspot-net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
